<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Open in Telegram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0e1720;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .card {
      width: min(370px, calc(100% - 40px));

      padding: 30px 24px;

      text-align: center;

      background: #1c2a35;

      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 80px;
      height: 80px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #229ed9;
    }

    .icon svg {
      width: 46px;
      height: 46px;

      fill: #ffffff;
    }

    h1 {
      margin: 0 0 12px;

      color: #ffffff;

      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
    }

    p {
      margin: 0 auto;

      max-width: 310px;

      color: #d7e0e7;

      font-size: 14px;
      line-height: 1.55;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M21.6 3.2c.3-1.2-.2-1.7-1.4-1.3L2.6 8.6c-1.2.4-1.2 1-.2 1.3l4.5 1.4 1.7 5.3c.2.7.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.5 3.3c.8.4 1.4.2 1.6-.7l3.1-14.2ZM8.6 11l9.9-6.2-8.1 7.2-.3 3.1-1.5-4.1Z"
        />
      </svg>
    </div>

    <h1>
      Open in Telegram
    </h1>

    <p>
      💱 Crypto &amp; Currency is a Telegram Mini App.
      Please open it from Telegram to use it.
    </p>

  </div>

</body>
</html>

<script>
  const tg = window.Telegram?.WebApp;

  const browserGuard = document.getElementById("browserGuard");
  const app = document.getElementById("app");

  // The app is allowed only when loaded through Telegram's
  // WebApp environment.
  const isTelegram =
    !!tg &&
    typeof tg.ready === "function" &&
    typeof tg.close === "function" &&
    typeof tg.initData === "string";

  if (!isTelegram) {
    // Browser: keep the actual app hidden.
    browserGuard.style.display = "flex";
    app.style.display = "none";
  } else {
    // Telegram: hide the block screen and reveal the app.
    browserGuard.style.display = "none";
    app.style.display = "block";

    tg.ready();
    tg.expand();

    // Telegram Back button
    if (tg.BackButton) {
      tg.BackButton.show();

      tg.BackButton.onClick(() => {
        tg.close();
      });
    }
  }
</script>
